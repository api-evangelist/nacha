aid: nacha
url: https://raw.githubusercontent.com/api-evangelist/nacha/refs/heads/main/apis.yml
name: Nacha
kind: company
description: 'Nacha (formerly the National Automated Clearing House Association) is the nonprofit, member-governed
  steward of the ACH Network, the batch-based account-to-account payment rail that moves consumer and
  business direct deposits, direct payments, bill pay, and B2B transfers across the United States — more
  than 30 billion payments and over $80 trillion in value annually. Nacha writes and enforces the Nacha
  Operating Rules that bind the network''s participating depository financial institutions, but it is
  not itself an ACH Operator (the Federal Reserve and The Clearing House clear and settle the files).
  Nacha is documentation- and rulebook-first rather than a self-serve PSP: it does not operate a public
  production payments API of its own. Its API posture is delivered through Afinis Interoperability Standards,
  the Nacha-stewarded group that publishes royalty-free, standardized financial-services API specifications
  (payment initiation, account validation, transaction status, returns reporting, and directory services)
  as Swagger/OpenAPI documents on SwaggerHub, and through Phixius, its payment-information exchange platform.
  Its home market is the United States.'
