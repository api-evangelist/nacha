    account:
      title: Account
      description: Details to identify an account
      type: object
      properties:
        identification:
          description: Unambiguous identification of the account of the debtor to which a debit entry will be made as a result of the transaction.
          type: string
          example: '111010151'
          maxLength: 34
        identificationCode:
          type: string
          example: BBAN
          minLength: 4
          maxLength: 4
          enum:
          - AIIN
          - BBAN
          - CUID
          - UPIC
          description: "A programmatic code:\n  * AIIN - IssuerIdentificationNumber - Issuer Identification Number (IIN) - identifies a card issuing institution in an international interchange environment. Issued by ABA (American Bankers Association).\n  * BBAN - BBANIdentifier - Basic Bank Account Number (BBAN) - identifier used nationally by financial institutions, ie, in individual countries, generally as part of a National Account Numbering Scheme(s), to uniquely identify the account of a customer.\n  * CUID - CHIPSUniversalIdentifier - (United States) Clearing House Interbank Payments System (CHIPS) Universal Identification (UID) - identifies entities that own accounts at CHIPS participating financial institutions, through which CHIPS payments are effected. The CHIPS UID is assigned by the New York Clearing House.\n  * UPIC - UPICIdentifier - Universal Payment Identification Code (UPIC) - identifier used by the New York Clearing House to mask confidential data, such as bank accounts and bank routing numbers. UPIC numbers remain with business customers, regardless of banking relationship changes.\n"
        type:
          type: string
          example: SVGS
          minLength: 4
          maxLength: 4
          enum:
          - CACC
          - CARD
          - CASH
          - CHAR
          - CISH
          - COMM
          - CPAC
          - LLSV
          - LOAN
          - MGLD
          - MOMA
          - NREX
          - ODFT
          - ONDP
          - OTHR
          - SACC
          - SLRY
          - SVGS
          - TAXE
          - TRAN
          - TRAS
          - VACC
          - NFCA
          description: "A programmatic code:\n  * CACC - Current - Account used to post debits and credits when no specific account has been nominated.\n  * CARD - CardAccount - Account used for credit card payments.\n  * CASH - CashPayment - Account used for the payment of cash.\n  * CHAR - Charges - Account used for charges if different from the account for         payment.\n  * CISH - CashIncome - Account used for payment of income if different from the current cash account\n  * COMM - Commission - Account used for commission if different from the account for payment.\n  * CPAC - ClearingParticipantSettlementAccount - Account used to post settlement debit and credit entries on behalf of a designated Clearing Participant.\n  * LLSV - LimitedLiquiditySavingsAccount - Account used for savings with special interest and withdrawal terms.  \n  * LOAN - Loan - Account used for loans.\n  * MGLD - MarginalLending - Account used for a marginal lending facility.\n  * MOMA - MoneyMarket - Account used for money markets if different from the cash account.\n  * NREX - NonResidentExternal - Account used for non-resident external.\n  * ODFT - Overdraft - Account is used for overdrafts.\n  * ONDP - OverNightDeposit - Account used for overnight deposits.\n  * OTHR - OtherAccount - Account not otherwise specified. \n  * SACC - Settlement - Account used to post debit and credit entries, as a result of transactions cleared and settled through a specific clearing and settlement system.\n  * SLRY - Salary - Accounts used for salary payments.\n  * SVGS - Savings - Account used for savings.\n  * TAXE - Tax - Account used for taxes if different from the account for payment.\n  * TRAN - TransactingAccount - A transacting account is the most basic type of bank account that you can get. The main difference between transaction and cheque accounts is that you usually do not get a cheque book with your transacting account and neither are you offered an overdraft facility.\n  * TRAS - CashTrading - Account used for trading if different from the current cash account.\n  * VACC - VirtualAccount - Account created virtually to facilitate collection and reconciliation.\n  * NFCA - NonResidentForeignCurrencyAccount - Non-Resident Individual / Entity Foreign Current held domestically.\n"
        name:
          type: string
          example: Business Expenses
          minLength: 1
          maxLength: 34
        proxyIdentification:
          type: string
          example: john.doe@gmail.com
          minLength: 1
          maxLength: 320
        proxyIdentificationCode:
          type: string
          example: EMAL
          minLength: 4
          maxLength: 4
          enum:
          - TELE
          - EMAL
          - DNAM
          - CINC
          - COTX
          - COID
          - CUST
          - DRLC
          - EIDN
          - EWAL
          - PVTX
          - LEIC
          - MBNO
          - NIDN
          - CCPT
          - SHID
          - SOSE
          - TOKN
          - UBIL
          - VIPN
          - BIID
          description: "A programmatic code:\n  * TELE - TelephoneNumber - A telephone number in the format specified by the 'The international public telecommunication numbering plan ITU-T E.164. \n  * EMAL - EmailAddress - Internationalised address of an electronic mail box for internet messages.\n  * DNAM - DomainName - Internationalised internet domain name.\n  * CINC - CertificateOfIncorporationNumber - Corporate Identification issued by a national  institution or regulator, used as account proxy. (applied for corporate account proxy).\n  * COTX - CorporateTaxIdentification - Unique government-issued tax Identification used as account proxy to identify the corporate (for example for government tax) and typically linked to the corporate bank account (applied for corporate account proxy).\n  * COID - CountryAuthorityIdentification - Identification issued by a national  institution or regulator (different from a national scheme like a clearing provider), used as account proxy (applied for corporate or individual account proxy).\n  * CUST - CustomerIdentificationNumber - Any other customer identification number issued by a corporate, bank or other organization, used as account proxy. (applied for corporate or individual account proxy).\n  * DRLC - DriverLicenseNumber - Unique government-issued Identification used as account proxy to  identify the individual  (for example for government charges, road taxes and tolls,vaccination charges) and typically linked to the individual's bank account (applied for  individual account proxy).\n  * EIDN - ElectronicIdentification - Government-issued Identification (different from a passport Identification or a national Identification). Used as account proxy to  identify the individual (for example for public benefits) and typically linked to the individual's bank account (applied for  individual account proxy).\n  * EWAL - EWalletIdentification - Market-adopted prepaid instruments like e-Wallets, payments to / from e-wallets from / to bank accounts (applied for corporate or individual account proxy).\n  * PVTX - IndividualTaxIdentification - Unique government-issued  tax Identification  used as account proxy to  identify the individual  for example for government tax) and typically linked to the individual's bank account (applied for  individual account proxy).\n  * LEIC - LegalEntityIdentifierCode - Legal Entity Identifier used as account proxy (applied for corporate account proxy). Use cases: Can be used by corporates as a \"government-issued\" Identification for registration with payment schemes as a proxy. The proxy may be further used for payments and collections using the underlying instant payment rails for a variety of corporate use cases.\n  * MBNO - MobilePhoneNumber - Mobile phone number in the format specified by the “The international public telecommunication numbering plan ITU- T E 164\" (applied for corporate or individual account proxy).\n  * NIDN - NationalIdentificationNumber - Unique government-issued Identification  used as account proxy to  identify the individual  or corporate for example for public benefits, government subsidies) and typically linked to the individual's / corporate bank account. (applied for corporate or individual account proxy).\n  * CCPT - PassportNumber - Unique government-issued Identification  used as account proxy to  identify the individual  (for example for government charges, road taxes, vaccination charges) and typically linked to the individual's bank account (applied for  individual account proxy).\n  * SHID - SchemeIdentificationNumber - Account proxy issued by a payment scheme (applied for corporate or individual account proxy). Use cases: Any proxies issued by clearing systems, for example VPA (India), FPS Identifier (Hong Kong), Jompay (Malaysia) CCIN (Canada).\n  * SOSE - SocialSecurityNumber - Unique government-issued Identification  used as account proxy to identify the individual  (for example for public benefits) and typically linked to the individual's bank account (applied for individual account proxy).\n  * TOKN - TokenIdentification - Electronic Identification used, for example, to mask an account number as a means of data secrecy. (applied for corporate or individual account proxy).\n  * UBIL - UtilitiesSubscriptionIdentification - Subscriber Identification for utilities and services. As opposed to a biller Identification, this identification is used for the subscriber of the service (applied for corporate or individual account proxy).\n  * VIPN - VehicleIdentificationPlateNumber - Account proxy for receiving insurance claims, pay insurance premium, road tax payments, traffic tickets etc.(applied for corporate or individual account proxy).\n  * BIID - BillerSubscriberIdentification - Billers of specific utilities could register for a Biller Identification as supported in the clearing scheme, and use this identification for collections (applied for corporate account proxy).\n"
