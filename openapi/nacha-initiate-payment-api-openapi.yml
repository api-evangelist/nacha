    agent:
      description: Identification of a financial institution.
      type: object
      required:
      - memberIdentification
      properties:
        clearingSystemIdentification:
          type: string
          example: USABA
          enum:
          - ATBLZ
          - AUBSB
          - CACPA
          - CHBCC
          - CHSIC
          - CNAPS
          - DEBLZ
          - ESNCC
          - GBDSC
          - GRBIC
          - HKNCC
          - IENCC
          - INFSC
          - ITNCC
          - JPZGN
          - NZNCC
          - PLKNR
          - PTNCC
          - RUCBC
          - SESBA
          - SGIBG
          - THCBC
          - TWNCC
          - USABA
          - USPID
          - ZANCC
          - NZRSA
          - MZBMO
          - CNCIP
          description: "A programmatic code:\n  * ATBLZ - AustrianBankleitzahl - Bank Branch code used in Austria\n  * AUBSB - AustralianBankStateBranchCodeBSB - Bank Branch code used in Australia\n  * CACPA - CanadianPaymentsAssociationPaymentRoutingNumber - Bank Branch code used in Canada\n  * CHBCC - SwissFinancialInstitutionIdentificationShort - Financial Institution Identification (IID) used in Switzerland, without check digit\n  * CHSIC - SwissFinancialInstitutionIdentificationLong - Financial Institution Identification (IID) used in Switzerland, including check digit\n  * CNAPS - CNAPSIdentifier - Bank Branch code used in China\n  * DEBLZ - GermanBankleitzahl - Bank Branch code used in Germany\n  * ESNCC - SpanishDomesticInterbankingCode - Bank Branch code used in Spain\n  * GBDSC - UKDomesticSortCode - Bank Branch code used in the UK\n  * GRBIC - HelenicBankIdentificationCode - Bank Branch code used in Greece\n  * HKNCC - HongKongBankCode - Bank Branch code used in Hong Kong\n  * IENCC - IrishNationalClearingCode - Bank Branch code used in Ireland\n  * INFSC - IndianFinancialSystemCode - Bank Branch code used in India\n  * ITNCC - ItalianDomesticIdentificationCode - Bank Branch code used in Italy\n  * JPZGN - JapanZenginClearingCode - Bank Branch code used in Japan\n  * NZNCC - NewZealandNationalClearingCode - Bank Branch code used in New Zealand\n  * PLKNR - PolishNationalClearingCode - Bank Branch code used in Poland\n  * PTNCC - PortugueseNationalClearingCode - Bank Branch code used in Portugal\n  * RUCBC - RussianCentralBankIdentificationCode - Bank Branch code used in Russia\n  * SESBA - SwedenBankgiroClearingCode - Bank Branch code used in Sweden\n  * SGIBG - IBGSortCode - Bank Branch code used in Singapore\n  * THCBC - ThaiCentralBankIdentificationCode - Bank Identification code used in Thailand\n  * TWNCC - FinancialInstitutionCode - Bank Branch code used in Taiwan\n  * USABA - UnitedStatesRoutingNumberFedwireNACHA - Routing Transit number assigned by the ABA for US financial institutons\n  * USPID - CHIPSParticipantIdentifier - Bank identifier used by CHIPs in the US\n  * ZANCC - SouthAfricanNationalClearingCode - Bank Branch code used in South Africa\n  * NZRSA - NewZealandRTGSClearingCode - RTGS settlement account used in New Zealand.\n  * MZBMO - BancoDeMocambiqueRTGS - Banco de Mocambique RTGS system.\n  * CNCIP - CrossBorderInterbankPaymentSystem - Cross-border Interbank Payment System (CIPS) Identifier.\n"
        memberIdentification:
          type: string
          minLength: 1
          maxLength: 35
          example: 061103852
        name:
          type: string
          example: Sample Bank
