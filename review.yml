    type: OpenAPI
    note: SwaggerHub registry (ASIG org) — verbatim source of all 24 harvested specs.
actions:
  openapiHarvested: true
  specsSaved: 24
  apisYmlCreated: true
  reason: |
    Nacha is a documentation/rulebook-first ACH scheme steward with no
    self-serve production API of its own, but it stewards a substantial, real,
    downloadable API standards catalog through Afinis. All 24 published Afinis
    Swagger specs were harvested verbatim and listed as separate apis[]
    entries; the developer catalog, ACH developer guide, Operating Rules, and
    Phixius platform are recorded as an honest identity + docs-pointer record.
